<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HR Incident Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% block body %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">HR Incident Tracker</a>
      {% if user %}
      <nav>
        <a href="/">Dashboard</a>
        <a href="/incidents/new" class="btn btn-primary">+ New Incident</a>
        <span class="user-chip">{{ user }}</span>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
