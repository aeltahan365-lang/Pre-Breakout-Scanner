name: Pre-Breakout Scanner v2

on:
  schedule:
    # Every 15 minutes — GitHub may delay a few minutes under load (normal)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Set to 'true' to enable verbose logging"
        required: false
        default: "false"

permissions:
  contents: write   # Required to commit updated state/known_symbols.json

# Prevents two runs (e.g. a scheduled run + a manual run) from racing
# to push to main at the same time. Runs queue instead of colliding.
concurrency:
  group: pre-breakout-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: "Run Pre-Breakout Scanner"
    runs-on: ubuntu-latest
    timeout-minutes: 13   # Safety cap — each run should finish well under 12 min

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # Only need latest commit

      # ── 2. Python setup ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"     # Cache pip dependencies between runs

      # ── 3. Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Run scanner ───────────────────────────────────────────
      - name: Run scanner
        id: scanner
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          # Auto-trading — see README "Live Auto-Trading" section before
          # touching any of these. AUTO_TRADING_ENABLED and BINANCE_TESTNET
          # are repo VARIABLES (Settings → Secrets and variables → Actions →
          # Variables tab), not secrets, so they can be flipped instantly as
          # a kill switch without editing a secret. The API key/secret ARE
          # secrets, and must be a Trade-only key (no withdrawal permission)
          # on a dedicated Binance sub-account.
          AUTO_TRADING_ENABLED: ${{ vars.AUTO_TRADING_ENABLED }}
          BINANCE_TESTNET:      ${{ vars.BINANCE_TESTNET }}
          BINANCE_API_KEY:      ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET:   ${{ secrets.BINANCE_API_SECRET }}
          DEBUG:                ${{ github.event.inputs.debug || 'false' }}
        run: |
          python scanner.py 2>&1 | tee scanner_output.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── 5. Upload log as artifact (7-day retention) ──────────────
      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_number }}
          path: scanner_output.log
          retention-days: 7

      # ── 6. Commit updated state ──────────────────────────────────
      - name: Commit state update
        run: |
          git config user.name  "pre-breakout-bot"
          git config user.email "actions@github.com"
          git add state/known_symbols.json state/trade_log.jsonl state/trading_state.json
          git diff --quiet --cached || git commit -m "chore: update state [skip ci]"
          git pull --rebase origin main
          git push
